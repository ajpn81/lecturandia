<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lecturandia - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>

<body class="login-page bg-light d-flex align-items-center justify-content-center vh-100">

  <div class="login-container">

    <div class="login-box">

      <h2>Iniciar sesión</h2>

      <form id="loginForm">

        <div class="form-group">
          <input
            type="email"
            placeholder="Correo electrónico"
            id="usuario"
            required>
        </div>

        <div class="form-group">
          <input
            type="password"
            placeholder="Contraseña"
            id="password"
            required>
        </div>

        <button
          type="submit"
          class="btn-principal w-100"
          id="btnLogin">
          Entrar
        </button>

        <div id="login-error" class="error_login_oculto"></div>

      </form>

    </div>

  </div>

  <script type="module" src="js/connect.js"></script>

</body>
</html>
