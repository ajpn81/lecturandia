<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Libros leídos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="container-fluid mt-4 main-frame">

  <!-- ✅ BARRA SUPERIOR -->
   <div class="top-bar top-bar-top">

    <div class="top-left-top">
      <img src="img/logo.png" class="logo-mini" alt="Lecturandia">
    </div>

    <div class="top-right-top">
      <span id="usuarioNombre"></span>
      <button id="btnLogout" class="btn-principal">Salir</button>
    </div>

  </div>
  <div class="top-bar">
    <input
      type="text" 
      id="busqueda" 
      class="form-control" 
      placeholder="Buscar por título, autor o nota..."
      style="margin-right: 10px; font-size: 1em;"
    >
    <div class="botones-derecha">
      <button id="nuevo" class="btn-principal">Nuevo</button>
      <button id="buscar" class="btn-principal">Buscar nuevo libro</button>
    </div>
  </div>

  <!-- ✅ LISTADO -->
  <div id="gridLibros" class="row g-4"></div>
  <button id="btnTop" class="btn-top">
    ↑
  </button>


</div>

<script type="module"src="js/leidos.js"></script>

</body>
</html>
