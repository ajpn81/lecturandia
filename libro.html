<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Libro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <!-- ✅ BARRA SUPERIOR -->
   <div class="top-bar top-bar-top top-bar-libro">

    <div class="top-left-top">
      <img src="img/logo.png" class="logo-mini" alt="Lecturandia">
    </div>

    <div class="top-right-top">
      <span id="usuarioNombre"></span>
      <button id="btnLogout" class="btn-principal">Salir</button>
    </div>

  </div>

<div class="container d-flex justify-content-center mt-5">

  <div class="libro-card row">

    <!-- PORTADA -->
    <div class="col-md-4 text-center">
      <img id="portada" class="portada-libro">
    </div>

    <!-- INFO -->
    <div class="col-md-8 libro-info">

      <div class="header-libro d-flex justify-content-between align-items-start">

        <div>
          <h1 id="titulo" class="titulo-libro"></h1>
          <h5 id="tituloOriginal" class="titulo-original"></h5>
          <p class="autor"><span id="autor"></span></p>
        </div>

        <!-- NOTA ARRIBA DERECHA -->
        <div class="nota-box">
          <small>NOTA</small>
          <span id="valoracion"></span>
        </div>

      </div>

      <!-- FECHAS -->
      <div class="fechas">
        <div>
          <span class="label">Inicio</span>
          <span id="fechaInicio"></span>
        </div>

        <div class="dias-box">
          <span id="dias"></span>
          <small>días</small>
        </div>

        <div>
          <span class="label">Fin</span>
          <span id="fechaFin"></span>
        </div>
      </div>

    </div>

    <div class="col-12 resumen-container">
      <h4>Resumen</h4>
      <p id="resumen"></p>

      <div class="acciones-libro">
        <button id="volver" class="btn-principal">Volver</button>

        <div class="acciones-derecha">
          <button id="borrar" class="btn-alerta">Borrar</button>
          <button id="editar" class="btn-principal">Editar</button>
        </div>
      </div>

    </div>

    

  </div>

</div>
<div id="modalConfirmacion" class="modal-overlay oculto">

  <div class="modal-box">

    <p class="modal-texto">¿Seguro que quieres borrar este libro?</p>

    <div class="modal-acciones">
      <button id="confirmarSi" class="btn-alerta">Sí</button>
      <button id="confirmarNo" class="btn-principal">No</button>
    </div>

  </div>

</div>
  
<script type="module" src="js/libro.js"></script>

</body>
</html>
