<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan A · Plan B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,800&family=Limelight&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Plan A: musical, noche de teatro */
    --a-bg: #22091f;
    --a-bg-2: #4a1238;
    --a-paper: #fff3e6;
    --a-ink: #2a0f24;
    --a-accent: #c4134f;
    --a-gold: #f2b44a;

    /* Plan B: Kurios, gabinete de curiosidades */
    --b-bg: #08262b;
    --b-bg-2: #123d40;
    --b-paper: #f5ead0;
    --b-ink: #0b2a2e;
    --b-accent: #9a6a10;
    --b-brass: #d9ae52;

    --tabs-h: 64px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-padding-top: var(--tabs-h); }

  body {
    font-family: "Jost", "Helvetica Neue", Arial, sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- Pestañas ---------- */
  .tabs {
    position: sticky;
    top: 0;
    z-index: 10;
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: var(--tabs-h);
    width: 100%;
  }

  .tab {
    position: relative;
    border: 0;
    cursor: pointer;
    font: 600 clamp(1.05rem, 2.4vw, 1.5rem)/1 "Jost", sans-serif;
    letter-spacing: .04em;
    color: rgba(255,255,255,.72);
    transition: color .25s ease, background-color .25s ease;
  }

  .tab::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 5px;
    transform: scaleX(0);
    transition: transform .35s ease;
  }

  .tab[aria-selected="true"] { color: #fff; }
  .tab[aria-selected="true"]::after { transform: scaleX(1); }

  .tab:focus-visible { outline: 3px solid #fff; outline-offset: -6px; }

  .tab-a { background: #3a0f30; }
  .tab-a[aria-selected="true"] { background: var(--a-accent); }
  .tab-a::after { background: var(--a-gold); }

  .tab-b { background: #0c3237; }
  .tab-b[aria-selected="true"] { background: var(--b-accent); }
  .tab-b::after { background: var(--b-brass); }

  /* ---------- Slide ---------- */
  .viewport { overflow: hidden; width: 100%; }

  .track {
    display: flex;
    width: 200%;
    min-height: calc(100vh - var(--tabs-h));
    transition: transform .6s cubic-bezier(.77, 0, .18, 1);
  }
  .track[data-active="b"] { transform: translateX(-50%); }

  .panel {
    width: 50%;
    flex: none;
    position: relative;
    padding-bottom: 72px;
  }

  .panel-a { background: radial-gradient(120% 80% at 50% 0%, var(--a-bg-2), var(--a-bg) 70%); }
  .panel-b { background: radial-gradient(120% 80% at 50% 0%, var(--b-bg-2), var(--b-bg) 70%); }

  /* ---------- Imagen superior, de lado a lado ---------- */
  .hero {
    position: relative;
    width: 100%;
    height: clamp(260px, 100vh, 620px);
    overflow: hidden;
  }
  .panel-a .hero { background: linear-gradient(135deg, #6b1a4c, #c4134f); }
  .panel-b .hero { background: linear-gradient(135deg, #0f4a4f, #9a6a10); }

  .hero img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: auto 0 0 0;
    height: 35%;
    pointer-events: none;
  }
  .panel-a .hero::after { background: linear-gradient(to top, var(--a-bg), transparent); }
  .panel-b .hero::after { background: linear-gradient(to top, var(--b-bg), transparent); }

  /* ---------- Vale ---------- */
  .ticket {
    position: relative;
    width: min(880px, calc(100% - 40px));
    margin: -72px auto 0;
    padding: clamp(28px, 5vw, 56px);
    border-radius: 18px;
    z-index: 2;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.7);
  }

  .panel-a .ticket { background: var(--a-paper); color: var(--a-ink); }
  .panel-b .ticket { background: var(--b-paper); color: var(--b-ink); }

  /* marco interior de latón en Plan B */
  .panel-b .ticket::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 2px solid var(--b-accent);
    border-radius: 12px;
    outline: 1px solid var(--b-accent);
    outline-offset: 4px;
    pointer-events: none;
    opacity: .75;
  }

  .ticket h1 {
    text-wrap: balance;
    text-transform: uppercase;
    line-height: 1.04;
    font-size: clamp(2.1rem, 6vw, 4.4rem);
  }

  .panel-a .ticket h1 {
    font-family: "Bodoni Moda", "Didot", "Times New Roman", serif;
    font-weight: 800;
    letter-spacing: .01em;
    color: var(--a-accent);
  }

  .panel-b .ticket h1 {
    font-family: "Limelight", "Poiret One", Georgia, serif;
    font-weight: 400;
    letter-spacing: .02em;
    color: var(--b-ink);
    text-align: center;
    padding: clamp(10px, 3vw, 28px) 0;
  }

  /* perforación del vale */
  .perf {
    position: relative;
    margin: clamp(26px, 4vw, 40px) 0;
    border-top: 3px dashed rgba(42, 15, 36, .35);
  }
  .perf::before,
  .perf::after {
    content: "";
    position: absolute;
    top: -21px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--a-bg);
  }
  .perf::before { left: calc(-1 * clamp(28px, 5vw, 56px) - 20px); }
  .perf::after  { right: calc(-1 * clamp(28px, 5vw, 56px) - 20px); }

  .desc-title {
    font-family: "Bodoni Moda", Georgia, serif;
    font-weight: 600;
    font-size: 1.5rem;
    margin-bottom: 14px;
  }

  .desc-list { list-style: none; display: grid; gap: 12px; }

  .desc-list li {
    position: relative;
    padding-left: 34px;
    font-size: clamp(1.1rem, 2.4vw, 1.45rem);
    line-height: 1.4;
    max-width: 62ch;
  }
  .desc-list li::before {
    content: "";
    position: absolute;
    left: 4px;
    top: .5em;
    width: 14px;
    height: 14px;
    background: var(--a-accent);
    transform: rotate(45deg);
    border-radius: 3px 0 3px 0;
  }

  /* ---------- Movimiento y adaptación ---------- */
  @media (prefers-reduced-motion: reduce) {
    .track, .tab, .tab::after { transition: none; }
  }

  @media (max-width: 520px) {
    :root { --tabs-h: 56px; }
    .ticket { margin-top: -48px; border-radius: 14px; }
  }
</style>
</head>
<body>

<nav class="tabs" role="tablist" aria-label="Planes">
  <button class="tab tab-a" role="tab" id="tab-a" aria-controls="panel-a" aria-selected="true">Plan A</button>
  <button class="tab tab-b" role="tab" id="tab-b" aria-controls="panel-b" aria-selected="false" tabindex="-1">Plan B</button>
</nav>

<main class="viewport">
  <div class="track" id="track" data-active="a">

    <!-- PLAN A -->
    <section class="panel panel-a" id="panel-a" role="tabpanel" aria-labelledby="tab-a">
      <div class="hero">
        <img src="imagen1.jpg" alt="El Alma al Aire" onerror="this.style.display='none'">
      </div>
      <article class="ticket">
        <h1>Vale por una entrada a El Alma al Aire</h1>
        <div class="perf" aria-hidden="true"></div>
        <h2 class="desc-title">Descripción:</h2>
        <ul class="desc-list">
          <li>Si vas con tus amigas, vale por la entrada.</li>
          <li>Si no van y hace falta transporte, yo os llevo.</li>
          <li>Si no van, yo iré contigo.</li>
        </ul>
      </article>
    </section>

    <!-- PLAN B -->
    <section class="panel panel-b" id="panel-b" role="tabpanel" aria-labelledby="tab-b" aria-hidden="true" inert>
      <div class="hero">
        <img src="imagen2.jpg" alt="Cirque du Soleil: Kurios" onerror="this.style.display='none'">
      </div>
      <article class="ticket">
        <h1>Vale por una entrada al Circo del Sol: Kurios</h1>
      </article>
    </section>

  </div>
</main>

<script>
  (function () {
    var track = document.getElementById('track');
    var tabs = { a: document.getElementById('tab-a'), b: document.getElementById('tab-b') };
    var panels = { a: document.getElementById('panel-a'), b: document.getElementById('panel-b') };

    function select(id, focus) {
      ['a', 'b'].forEach(function (k) {
        var on = k === id;
        tabs[k].setAttribute('aria-selected', on);
        tabs[k].tabIndex = on ? 0 : -1;
        panels[k].setAttribute('aria-hidden', !on);
        if (on) panels[k].removeAttribute('inert'); else panels[k].setAttribute('inert', '');
      });
      track.dataset.active = id;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      if (focus) tabs[id].focus();
      try { history.replaceState(null, '', '#plan-' + id); } catch (e) {}
    }

    tabs.a.addEventListener('click', function () { select('a'); });
    tabs.b.addEventListener('click', function () { select('b'); });

    document.querySelector('.tabs').addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') select('b', true);
      if (e.key === 'ArrowLeft') select('a', true);
    });

    if (location.hash === '#plan-b') select('b');
  })();
</script>
</body>
</html>
